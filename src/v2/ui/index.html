<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escalation System v2</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <aside class="appnav" aria-label="Application">
    <div class="appnav-brand">
      <span class="appnav-logo" aria-hidden="true">E</span>
      <div class="appnav-name">
        <strong>Escalations System v2</strong>
        <span>myBasePay</span>
      </div>
    </div>
    <span class="backend-indicator" id="backendIndicator" role="status">Mock backend</span>
    <nav class="appnav-items" aria-label="Main navigation">
      <button class="nav-item" aria-current="false">Home</button>
      <button class="nav-item" aria-current="page">Tickets</button>
      <button class="nav-item" aria-current="false">Queues</button>
      <button class="nav-item" aria-current="false">Reports</button>
      <button class="nav-item" aria-current="false">Members</button>
      <button class="nav-item" aria-current="false">Knowledge</button>
      <button class="nav-item" aria-current="false">Settings</button>
      <button class="nav-item" aria-current="false">Help</button>
    </nav>
    <div class="appnav-foot">
      <button class="collapse-btn" type="button">Collapse</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <div class="banner" id="backendBanner" role="status">
        Mock data only — not connected to any live system (no Graph / SharePoint / production).
      </div>
      <div class="ctx-controls">
        <label>Current user
          <select id="userSelect"></select>
        </label>
        <label>Department
          <select id="deptSelect"></select>
        </label>
      </div>
    </header>

    <main class="content">
      <!-- Queue / reporting view (default) -->
      <section class="view" id="viewList">
        <div class="view-head">
          <div>
            <h1 id="listTitle">All tickets</h1>
            <p class="panel-hint" id="listHint"></p>
          </div>
          <button class="btn primary" id="newTicketBtn" title="Creates a namespaced demo ticket (esc_demo_loop24_*) via the active backend">New demo ticket</button>
        </div>
        <div class="page-tabs" role="tablist" aria-label="Ticket views">
          <button class="page-tab" id="tabAll" type="button" role="tab" aria-selected="true">All tickets</button>
          <button class="page-tab" id="tabDept" type="button" role="tab" aria-selected="false">Department queue</button>
          <button class="page-tab" id="tabMine" type="button" role="tab" aria-selected="false">My assigned</button>
          <button class="page-tab" id="tabReport" type="button" role="tab" aria-selected="false">Reporting</button>
        </div>
        <div class="metrics-strip" id="metricsStrip" aria-label="Queue metrics"></div>
        <div class="filter-toolbar" id="filterToolbar">
          <label id="filterScopeLabel">Scope
            <select id="filterScope" aria-label="Filter by assignment scope"></select>
          </label>
          <label>Status
            <select id="filterStatus" aria-label="Filter by status"></select>
          </label>
          <label>Priority
            <select id="filterPriority" aria-label="Filter by priority"></select>
          </label>
          <label id="filterDeptLabel">Department / queue
            <select id="filterDept" aria-label="Filter by department or queue"></select>
          </label>
          <label class="toggle" title="No movement past the priority threshold — local indicator only, no notification is sent">
            <input type="checkbox" id="filterAttention" />
            <span>Needs attention</span>
          </label>
          <button class="btn filters-btn" id="filtersBtn" type="button">Filters</button>
          <div class="toolbar-search">
            <input id="searchInput" type="search" placeholder="Search title or id…" aria-label="Search tickets" />
          </div>
        </div>
        <div class="new-ticket-row" id="newTicketRow">
          <input id="newTicketTitle" type="text" placeholder="New demo ticket title…" aria-label="New demo ticket title" />
        </div>
        <ul class="ticket-list" id="ticketList"></ul>
        <div class="report" id="report" hidden></div>
      </section>

      <!-- Ticket detail view (replaces the queue when a ticket is open) -->
      <section class="view" id="viewDetail" hidden>
        <button class="back-link" id="backToQueue">← Back to queue</button>
        <article class="detail" id="detail"></article>
      </section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
